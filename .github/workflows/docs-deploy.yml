name: Deploy to GitHub pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs-source/**"
      - "sdk/anip-sdk/src/**"
      - "sdk/anip-sdk/build.gradle.kts"
      - "sdk/build.gradle.kts"
      - "sdk/gradle/**"
      - "sdk/gradle.properties"
      - "sdk/settings.gradle.kts"
      - ".github/workflows/**"
      - "!.github/workflows/release-icon-resources.yml"
      - "!.github/workflows/request-adaption.yml"
      - "!.github/workflows/resolve-submit-adaption.yml"
      - "!.github/workflows/submit-adaption.yml"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          java-package: jdk
          distribution: "temurin"
          cache: "gradle"
      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: gradle-deps-sdk-${{ hashFiles('sdk/**/*.gradle.kts', 'sdk/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-deps
      - name: Build VitePress site
        run: |
          cd docs-source
          yarn -i
          yarn docs:build-gh-pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: docs-source/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}