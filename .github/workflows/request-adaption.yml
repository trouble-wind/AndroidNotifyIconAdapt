name: Request Notification Icon Adaption

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  issues: write

jobs:
  update-issue-title:
    if: >-
      contains(github.event.issue.labels.*.name, 'request-adaption') &&
      (github.event.action == 'opened' ||
      (github.event.action == 'edited' && github.event.changes.body) ||
      (github.event.action == 'labeled' && github.event.label.name == 'request-adaption'))
    runs-on: ubuntu-latest
    concurrency:
      group: request-adaption-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Update Request Title
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const parameters = { ...context.repo, issue_number: context.issue.number };
            const { data: issue } = await github.rest.issues.get(parameters);
            if (!issue.labels.some(label => label.name === 'request-adaption')) return;

            const body = (issue.body ?? '').replace(/\r\n?/g, '\n');
            const section = body.match(/^### App Label \/ 应用名称[ \t]*\n([\s\S]*)/m);
            const appLabel = section?.[1].split(/^### /m, 1)[0].trim().replace(/\s+/g, ' ');
            if (!appLabel || appLabel === '_No response_') return;

            const title = Array.from(`[Request] ${appLabel}`).slice(0, 256).join('');
            if (issue.title === title) return;

            await github.rest.issues.update({ ...parameters, title });